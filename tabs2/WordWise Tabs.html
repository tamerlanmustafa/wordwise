<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WordWise · Tabs (My Movies + Practice)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: #ece8df; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
    #root { width: 100%; height: 100%; }
    .ww-artboard-inner *::-webkit-scrollbar { display: none; }
    .ww-artboard-inner * { scrollbar-width: none; }
    @keyframes wwSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes wwCaret { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="../design-canvas.jsx"></script>
  <script type="text/babel" src="../ios-frame.jsx"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="my-movies.jsx"></script>
  <script type="text/babel" src="practice.jsx"></script>
  <script type="text/babel" src="quiz.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;
    const { IOSDevice } = window;
    const { MyMoviesScreen } = window.WW_MY_MOVIES;
    const { PracticeScreen } = window.WW_PRACTICE;
    const { SynonymMCQScreen, TranslationTypeScreen } = window.WW_QUIZ;

    function Frame({ children, dark = true }) {
      return (
        <div className="ww-artboard-inner" style={{ width: '100%', height: '100%' }}>
          <IOSDevice width={402} height={874} dark={dark}>
            <div style={{ width: '100%', height: '100%', overflow: 'hidden' }}>
              {children}
            </div>
          </IOSDevice>
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas
          title="WordWise · two-tab template"
          subtitle="A simpler split. ‘My Movies’ is a flat, filterable list (the reel’s rejected zigzag is gone). ‘Practice’ is a Duolingo-style learning path with movie-themed units. Both modes shown."
          initialZoom={0.55}
        >
          <DCSection
            id="my-movies"
            title="Tab 1 — My Movies"
            subtitle="Flat list, sortable + filterable. Movies the user has added; tap a row → MoviePreviewHub. ‘+’ FAB opens search."
          >
            <DCArtboard id="movies-dark"  label="① My Movies — dark"  width={402} height={874}>
              <Frame dark><MyMoviesScreen mode="dark"  /></Frame>
            </DCArtboard>
            <DCArtboard id="movies-light" label="② My Movies — light" width={402} height={874}>
              <Frame dark={false}><MyMoviesScreen mode="light" /></Frame>
            </DCArtboard>
          </DCSection>

          <DCSection
            id="practice"
            title="Tab 2 — Practice"
            subtitle="Duolingo-style path. Daily SRS hero up top, then a vertical zigzag of lesson nodes grouped under movie ‘units’ (each unit headed by a marquee strip). Cinema styling without the film-reel substrate."
          >
            <DCArtboard id="practice-dark"  label="③ Practice — dark"  width={402} height={874}>
              <Frame dark><PracticeScreen mode="dark"  /></Frame>
            </DCArtboard>
            <DCArtboard id="practice-light" label="④ Practice — light" width={402} height={874}>
              <Frame dark={false}><PracticeScreen mode="light" /></Frame>
            </DCArtboard>
          </DCSection>

          <DCSection
            id="quiz-mcq"
            title="Quiz — synonym MCQ (card_type: 'synonym_mcq')"
            subtitle="4-choice synonym multiple-choice. Word card + 4 stacked synonym options. Auto-advances on tap; wrong answers reveal the correct option in green and turn the CTA into ‘Got it · Continue’."
          >
            <DCArtboard id="mcq-dark-idle"   label="⑤ MCQ · idle · dark"            width={402} height={874}>
              <Frame dark><SynonymMCQScreen mode="dark" state="idle" /></Frame>
            </DCArtboard>
            <DCArtboard id="mcq-light-idle"  label="⑥ MCQ · idle · light"           width={402} height={874}>
              <Frame dark={false}><SynonymMCQScreen mode="light" state="idle" /></Frame>
            </DCArtboard>
            <DCArtboard id="mcq-dark-wrong"  label="⑦ MCQ · wrong answered · dark"  width={402} height={874}>
              <Frame dark><SynonymMCQScreen mode="dark" state="wrong" /></Frame>
            </DCArtboard>
            <DCArtboard id="mcq-light-wrong" label="⑧ MCQ · wrong answered · light" width={402} height={874}>
              <Frame dark={false}><SynonymMCQScreen mode="light" state="wrong" /></Frame>
            </DCArtboard>
          </DCSection>

          <DCSection
            id="quiz-type"
            title="Quiz — translation typing (card_type: 'type')"
            subtitle="Free-text translation. Word card + hint chips + input. ‘Don’t know’ shortcut reveals the answer. Correct turns input + CTA green."
          >
            <DCArtboard id="type-dark-prompt"   label="⑨  Typing · prompt · dark"   width={402} height={874}>
              <Frame dark><TranslationTypeScreen mode="dark" state="prompt" /></Frame>
            </DCArtboard>
            <DCArtboard id="type-light-prompt"  label="⑩ Typing · prompt · light"   width={402} height={874}>
              <Frame dark={false}><TranslationTypeScreen mode="light" state="prompt" /></Frame>
            </DCArtboard>
            <DCArtboard id="type-dark-correct"  label="⑪ Typing · correct · dark"   width={402} height={874}>
              <Frame dark><TranslationTypeScreen mode="dark" state="correct" /></Frame>
            </DCArtboard>
            <DCArtboard id="type-light-correct" label="⑫ Typing · correct · light"  width={402} height={874}>
              <Frame dark={false}><TranslationTypeScreen mode="light" state="correct" /></Frame>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
