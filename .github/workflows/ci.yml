name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck + build
        # `npm run build` already runs `tsc -b && vite build`, which is what
        # ships to production. Failing the build here catches the same
        # errors the deploy workflow would hit later.
        run: npm run build
        env:
          VITE_API_URL: http://ci.invalid
          VITE_GOOGLE_CLIENT_ID: ci-placeholder
          VITE_TMDB_API_KEY: ci-placeholder

  mobile:
    name: mobile (tsc + jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Jest
        run: npm test -- --ci

  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dev deps
        # Only the lean dev subset — heavy ML deps (spacy, sentence-transformers)
        # are not needed to run unit tests. Add a separate integration job
        # later if/when we need them.
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest -q
